<header class="masthead">
  <div class="wrap masthead__in">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">{{ site.title }}</a>
    <span class="tagline">{{ site.subtitle }}</span>
    <nav class="nav" aria-label="Primary">
      {%- for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% elsif item.section and page.section == item.section %} class="in-section"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
