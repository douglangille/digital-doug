<div id="graph-container" style="width: 100%; height: 80vh; margin-bottom: 0;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
  fetch('{{ site.baseurl }}/assets/data/graph.json')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('graph-container');
      let width = container.clientWidth;
      let height = container.clientHeight;
      const isMobile = window.innerWidth < 768;

      const svg = d3.select('#graph-container').append('svg')
        .attr('width', width)
        .attr('height', height)
        .style('background', '#fafafa');

      // Add defs for gradients
      const defs = svg.append('defs');
      const gradient = defs.append('linearGradient')
        .attr('id', 'gradient')
        .attr('x1', '0%').attr('y1', '0%')
        .attr('x2', '100%').attr('y2', '100%');
      gradient.append('stop').attr('offset', '0%').attr('stop-color', '#f5f5f5');
      gradient.append('stop').attr('offset', '100%').attr('stop-color', '#ffffff');

      const g = svg.append('g');
      const zoom = d3.zoom()
        .scaleExtent([0.5, 4])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });
      svg.call(zoom);

      const chargeStrength = isMobile ? -250 : -600;
      const linkDistance = isMobile ? 80 : 180;
      const nodeRadius = (d) => isMobile ? 
        Math.max(10, Math.sqrt(d.size) * 3.8) : 
        Math.max(14, Math.sqrt(d.size) * 5.5);

      const simulation = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.edges)
          .id(d => d.id)
          .distance(linkDistance)
          .strength(0.4))
        .force('charge', d3.forceManyBody().strength(chargeStrength).distanceMax(500))
        .force('collide', d3.forceCollide().radius(d => nodeRadius(d) + 5))
        .force('center', d3.forceCenter(0, 0));

      const link = g.selectAll('line')
        .data(data.edges)
        .enter().append('line')
        .attr('stroke', '#e0e0e0')
        .attr('stroke-width', isMobile ? 0.8 : 1.2)
        .attr('opacity', 0.6);

      const nodeGroup = g.selectAll('g.node')
        .data(data.nodes)
        .enter().append('g')
        .attr('class', 'node')
        .style('cursor', 'pointer')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      const colors = [
        '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
        '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B88B', '#52C3B8',
        '#FF8A65', '#64B5F6', '#81C784', '#E57373', '#7986CB'
      ];

      nodeGroup.append('circle')
        .attr('r', nodeRadius)
        .attr('fill', d => colors[Math.abs(d.id.charCodeAt(0)) % colors.length])
        .attr('stroke', '#fff')
        .attr('stroke-width', isMobile ? 2 : 2.5)
        .on('click', (event, d) => {
          window.location.href = '{{ site.baseurl }}/' + d.id + '/';
        });

      nodeGroup.append('text')
        .attr('text-anchor', 'middle')
        .attr('dy', '.35em')
        .attr('font-size', isMobile ? '9px' : '11px')
        .attr('fill', '#1a1a1a')
        .attr('font-weight', '700')
        .attr('pointer-events', 'none')
        .text(d => d.label);

      nodeGroup.on('mouseover', function(event, d) {
        d3.select(this).select('circle')
          .attr('r', d => nodeRadius(d) + (isMobile ? 3 : 5))
          .attr('filter', 'drop-shadow(0 0 10px rgba(0,0,0,0.25))');
        
        link.attr('stroke', e => 
          (e.source.id === d.id || e.target.id === d.id) ? '#666' : '#e0e0e0'
        ).attr('stroke-width', e => 
          (e.source.id === d.id || e.target.id === d.id) ? (isMobile ? 1.5 : 2.2) : (isMobile ? 0.8 : 1.2)
        ).attr('opacity', e =>
          (e.source.id === d.id || e.target.id === d.id) ? 0.9 : 0.4
        );
        
        d3.selectAll('g.node text').attr('opacity', l => (l.id === d.id) ? 1 : 0.4);
      })
      .on('mouseout', function(event, d) {
        d3.select(this).select('circle')
          .attr('r', nodeRadius)
          .attr('filter', null);
        
        link.attr('stroke', '#e0e0e0')
          .attr('stroke-width', isMobile ? 0.8 : 1.2)
          .attr('opacity', 0.6);
        d3.selectAll('g.node text').attr('opacity', 1);
      });

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        nodeGroup
          .attr('transform', d => `translate(${d.x},${d.y})`);
      });

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }
      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }
      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

      // Auto-fit all nodes in view on load
      setTimeout(() => {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        data.nodes.forEach(d => {
          minX = Math.min(minX, d.x);
          minY = Math.min(minY, d.y);
          maxX = Math.max(maxX, d.x);
          maxY = Math.max(maxY, d.y);
        });

        const nodeWidth = maxX - minX;
        const nodeHeight = maxY - minY;
        const scale = 0.85 / Math.max(nodeWidth / width, nodeHeight / height);
        const translateX = (width / 2) - (scale * (minX + nodeWidth / 2));
        /*
        const translateY = (height / 2) - (scale * (minY + nodeHeight / 2));
        */
        const translateY = 40 - (scale * minY);

        svg.transition()
          .duration(800)
          .call(zoom.transform, d3.zoomIdentity.translate(translateX, translateY).scale(scale));
      }, 0);

      window.addEventListener('resize', () => {
        const newWidth = container.clientWidth;
        const newHeight = container.clientHeight;
        if (newWidth !== width || newHeight !== height) {
          width = newWidth;
          height = newHeight;
          svg.attr('width', width).attr('height', height);
          simulation.force('center', d3.forceCenter(0, 0)).alpha(0.3).restart();
        }
      });
    });
</script>

<style>
#graph-container {
  background: #fafafa;
  border-radius: 0;
  box-shadow: none;
  position: relative;
}

body {
  overflow-x: hidden;
}

@media (max-width: 767px) {
  #graph-container {
    height: 60vh !important;
  }
}
</style>
