# Site identity. Theme: hand-written, no gem (see DESIGN.md).
title                     : "Digital Doug"
subtitle                  : "Where pixels meet purpose"
name                      : "Doug Langille"
description               : "Tech-related brain-droppings about innovation, productivity, and higher ed. You've been warned."
baseurl                   : ""
url                       : "https://digital.douglangille.ca"
repository                : "douglangille/digital-doug"
email                     : "me@douglangille.ca"
locale                    : "en-CA"
timezone                  : "America/Halifax"
# Email list (Substack). If left empty the buttons fall back to FeedRabbit.
newsletter_url            : "https://digitaldoug.substack.com/"
goatcounter               : "digitaldoug"
colophon                  : "Set in Libron, Inter and JetBrains Mono."
theme_colors              : { light: "#faf4ed", dark: "#232136" }
preload_fonts             : ["Libron-Regular", "Inter"]
band_title                : "A new essay most weeks"
band_text                 : "Except when I don't. No algorithm, no feed to doomscroll, just the post."
og_image                  : "/assets/images/og-digital-doug.png"
words_per_minute          : 200

author:
  name: "Doug Langille"
  avatar: "/assets/images/bio-photo.png"
  bio: "IT manager, tech writer, and creative storyteller"
  links:
    - { label: "Nova Scotia", url: "https://en.wikipedia.org/wiki/Nova_Scotia" }
    - { label: "Darkling Whim", url: "https://douglangille.ca" }
    - { label: "LinkedIn", url: "https://www.linkedin.com/in/douglangille/" }
    - { label: "Email", url: "mailto:me@douglangille.ca" }

footer:
  since                   : "2019"
  links:
    - { label: "About", url: "/about/" }
    - { label: "Darkling Whim", url: "https://douglangille.ca" }
    - { label: "Amazon", url: "https://www.amazon.com/author/douglangille" }
    - { label: "LinkedIn", url: "https://www.linkedin.com/in/douglangille/" }
    - { label: "RSS", url: "/feed.xml" }

# Tags are two axes, shown as two filter groups on /articles/.
tag_groups:
  - label: Scope
    tags: [foundational, personal, institutional, interpersonal]
  - label: Stance
    tags: [diagnostic, prescriptive]

markdown                  : kramdown
highlighter               : rouge
permalink                 : /:title/
excerpt_separator         : "\n\n"
incremental               : false
encoding                  : "utf-8"

include:
  - .htaccess
  - _pages
exclude:
  # Writing Studio / Private PARA Folders
  - /__inbox
  - /_books
  - /_digital_doug
  - /_farm
  - /_life
  - /_plan
  - /_tech
  - /_work
  - /_writing
  - /_drafts
  - /story-engine
  # Build & Environment
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - "*.sublime-project"
  - "*.sublime-workspace"
  - /docs
  - /test

# -----------------------------------------------------------------------------
# Plugins & Pagination
# -----------------------------------------------------------------------------

sass:
  style                   : compressed

plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-gist

jekyll-archives:
  enabled                 : [tags]
  layouts:
    tag                   : tag
  permalinks:
    tag                   : /tag/:name/

defaults:
  - scope: { path: "assets" }
    values: { sitemap: false }
  - scope: { path: "" }
    values: { layout: "page" }
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
