# -----------------------------------------------------------------------------
# Site Identity & Metadata (Digital Doug)
# -----------------------------------------------------------------------------
title: "Digital Doug"
subtitle: "Where pixels meet purpose"
description: "Tech-related brain-droppings about innovation, productivity, and higher ed. You've been warned."
baseurl: ""
url: "https://digital.douglangille.ca"
repository: "douglangille/digital-doug"

email: "me@douglangille.ca"
locale: "en-CA"
timezone: "America/Halifax"

# -----------------------------------------------------------------------------
# Theme & Visuals
# -----------------------------------------------------------------------------
theme                     : "minimal-mistakes-jekyll"
minimal_mistakes_skin     : "default"
logo                      : 
teaser                    : "/assets/images/white500x300.jpg"
og_image                  : "/assets/images/og-digital-doug.png"
title_separator           : "-"
words_per_minute          : 200
breadcrumbs               : false
search                    : true
search_full_content       : false
search_provider           : lunr

# -----------------------------------------------------------------------------
# Author & Social
# -----------------------------------------------------------------------------
author:
  name: "Doug Langille"
  avatar: "/assets/images/bio-photo.png"
  bio: "IT manager, tech writer, and creative storyteller"
  links:
    - label: "Nova Scotia"
      icon: "fa-regular fa-location-dot"
      url: "https://en.wikipedia.org/wiki/Nova_Scotia"
    - label: "Darkling Whim"
      icon: "fa-solid fa-feather"
      url: "https://douglangille.ca"
    - label: "LinkedIn"
      icon: "fa-brands fa-square-linkedin"
      url: "https://www.linkedin.com/in/douglangille/"
    - label: "Email"
      icon: "fa-regular fa-envelope"
      url: "mailto:me@douglangille.ca"

footer:
  since                   : "2019"
  links:
    - label               : "Darkling Whim"
      icon                : "fa-solid fa-feather"
      url                 : "https://douglangille.ca"
    - label               : "Digital Doug"
      icon                : "fa-regular fa-newspaper"
      url                 : "https://digital.douglangille.ca"
    - label               : "Amazon"
      icon                : "fa-brands fa-amazon"
      url                 : "https://www.amazon.com/author/douglangille"
    - label               : "LinkedIn"
      icon                : "fa-brands fa-square-linkedin"
      url                 : "https://www.linkedin.com/in/douglangille/"

# -----------------------------------------------------------------------------
# Comments
# -----------------------------------------------------------------------------
comments:
  provider: "giscus"
  giscus:
    repo: "douglangille/comments"
    repo_id: "R_kgDORK-uyQ"
    category: "General"
    category_id: "DIC_kwDORK-uyc4C2BM0"
    mapping: "pathname"
    strict: "0"
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: "bottom"
    theme: "preferred_color_scheme"
    lang: "en"


# -----------------------------------------------------------------------------
# Build & Formatting
# -----------------------------------------------------------------------------
markdown                  : kramdown
highlighter               : rouge
permalink                 : /:title/
excerpt_separator         : "\n\n"
incremental               : false
encoding                  : "utf-8"

include:
  - .htaccess
  - _pages
exclude:
  # Writing Studio / Private PARA Folders
  - /__inbox
  - /_books
  - /_digital_doug
  - /_farm
  - /_life
  - /_plan
  - /_tech
  - /_work
  - /_writing
  - /_drafts
  - /story-engine
  # Build & Environment
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - "*.sublime-project"
  - "*.sublime-workspace"
  - /docs
  - /test

# -----------------------------------------------------------------------------
# Plugins & Pagination
# -----------------------------------------------------------------------------
plugins:
  - jekyll-paginate-v2
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-include-cache

category_archive:
  type                    : jekyll-archives
  path                    : /
tag_archive:
  type                    : jekyll-archives
  path                    : /
pagination:
  enabled                 : true
  collection              : 'posts'
  per_page                : 12
  permalink               : '/page/:num/'
  sort_field              : 'date'
  sort_reverse            : true
  trail:
      before              : 2
      after               : 2  

autopages:
  enabled                 : true
  categories:
    enabled               : false
  collections:
    enabled               : false
  tags:
    enabled               : true
    layouts:               
      - 'archive-taxonomy.html'
    permalink             : '/:tag/' 

# -----------------------------------------------------------------------------
# Related Posts (Theme Logic)
# -----------------------------------------------------------------------------
related_by                : tags or categories 
related_limit             : 4            
related_categories        : 1       
related_tags              : 1    
related_template          : archive-single.html
related_layout            : grid

# -----------------------------------------------------------------------------
# Defaults (Front Matter)
# -----------------------------------------------------------------------------
defaults:
  - scope:
      path                : "" 
    values:
      layout              : "single"
      author_profile      : true
      read_time           : true
      share               : false
      related             : true
      comments            : true
      show_date           : true
      excerpt             : ""
      overlay_filter      : 0.5
