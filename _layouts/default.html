<!doctype html>
<html lang="{{ site.locale | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script>
(function () {
  var r = document.documentElement, b = document.querySelector(".theme-toggle");
  var order = ["system", "light", "dark"], names = { system: "follow system", light: "light", dark: "dark" };
  function mode() { return r.dataset.theme || "system"; }
  function label() {
    var m = mode(), next = order[(order.indexOf(m) + 1) % 3];
    b.setAttribute("aria-label", "Theme: " + names[m] + ". Activate to switch to " + names[next] + ".");
    b.title = "Theme: " + names[m];
  }
  b.addEventListener("click", function () {
    var next = order[(order.indexOf(mode()) + 1) % 3];
    if (next === "system") { delete r.dataset.theme; } else { r.dataset.theme = next; }
    try { next === "system" ? localStorage.removeItem("theme") : localStorage.setItem("theme", next); } catch (e) {}
    label();
  });
  label();
})();
</script>
</body>
</html>
